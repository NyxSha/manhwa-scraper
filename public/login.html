<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/gif" href="/favicon.gif">
    <link rel="apple-touch-icon" href="/favicon.gif">
    <link rel="manifest" href="/manifest.json">
    <title>manhwafuta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;900&display=swap');
        * { font-family: 'Kanit', sans-serif; }
        body {
            background: #0a0a0b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(120, 30, 180, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(220, 40, 80, 0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 20% 80%, rgba(180, 30, 120, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .login-card {
            background: linear-gradient(145deg, rgba(18, 18, 22, 0.95), rgba(26, 26, 32, 0.95));
            border: 1px solid rgba(180, 30, 120, 0.25);
            border-radius: 24px;
            padding: 48px 40px 40px;
            width: 380px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(180, 30, 120, 0.05);
            backdrop-filter: blur(20px);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 30%; right: 30%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b41e78, #dc2850, #b41e78, transparent);
            border-radius: 50%;
        }
        .logo-icon {
            font-size: 42px;
            line-height: 1;
            text-align: center;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 20px rgba(180, 30, 120, 0.3));
        }
        .glow-text {
            background: linear-gradient(135deg, #e879d0, #dc2850);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .subtitle {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }
        .input-field {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 18px;
            width: 100%;
            color: #e4e4e7;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }
        .input-field:focus {
            border-color: rgba(180, 30, 120, 0.4);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 20px rgba(180, 30, 120, 0.05);
        }
        .input-field::placeholder { color: rgba(255,255,255,0.15); }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            background: linear-gradient(135deg, #b41e78, #dc2850);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(180, 30, 120, 0.3);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .error-msg.show { opacity: 1; }
        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        .dot:nth-child(1) { background: rgba(180,30,120,0.6); }
        .dot:nth-child(3) { background: rgba(220,40,80,0.4); }
        .lock-icon {
            text-align: center;
            margin-bottom: 8px;
            font-size: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="lock-icon">✦</div>
        <div class="logo-icon">⛩</div>
        <div style="text-align:center;margin-bottom:6px;">
            <span class="glow-text">manhwafuta</span>
        </div>
        <div style="text-align:center;margin-bottom:32px;">
            <span class="subtitle">Manhwa Reader</span>
        </div>
        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">
            <input type="text" id="login-username" class="input-field" placeholder="Username" autocomplete="off">
            <input type="password" id="login-password" class="input-field" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="error-msg" id="login-error"></div>
        <div style="margin-top:20px;">
            <button id="login-btn" class="login-btn" onclick="doLogin()">Enter</button>
        </div>
    </div>

    <script>
        async function doLogin() {
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            const error = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                error.textContent = 'Enter username and password';
                error.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Authorizing...';
            error.classList.remove('show');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    error.textContent = data.error || 'Invalid credentials';
                    error.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Enter';
                }
            } catch (e) {
                error.textContent = 'Connection error';
                error.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Enter';
            }
        }
    </script>
</body>
</html>
