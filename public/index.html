<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/gif" href="/favicon.gif">
  <link rel="apple-touch-icon" href="/favicon.gif">
  <link rel="manifest" href="/manifest.json">
  <title>manhwafuta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e2e8f0; min-height: 100vh; margin: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #2d2d44; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d3d5c; }

    .bg-gradient-main { background: linear-gradient(135deg, #0a0a0f 0%, #0f0a1a 50%, #0a0a0f 100%); }
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
    .card { background: linear-gradient(145deg, rgba(18,18,28,0.9), rgba(24,24,38,0.9)); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); overflow: hidden; }
    .card:hover { transform: translateY(-4px); border-color: rgba(168,85,247,0.25); box-shadow: 0 12px 40px rgba(168,85,247,0.12); }

    .manga-cover { aspect-ratio: 3/4; object-fit: cover; background: #1a1a2e; }
    .section-enter { animation: fadeSlideIn 0.35s ease-out; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .btn-primary { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; font-weight: 600; border: none; border-radius: 10px; padding: 8px 20px; cursor: pointer; transition: all 0.25s ease; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(168,85,247,0.3); }
    .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 16px; color: #94a3b8; cursor: pointer; transition: all 0.2s ease; font-size: 13px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); color: white; }
    .btn-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.2); border-radius: 10px; padding: 8px 16px; color: #f87171; cursor: pointer; transition: all 0.2s; font-size: 13px; }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    input[type="text"], input[type="search"] { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 9px 14px; color: white; outline: none; transition: all 0.2s; font-size: 14px; }
    input[type="text"]:focus, input[type="search"]:focus { border-color: rgba(168,85,247,0.4); }

    .chapter-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 14px; color: #cbd5e1; cursor: pointer; transition: all 0.2s; text-align: left; font-size: 13px; }
    .chapter-btn:hover { background: rgba(168,85,247,0.1); border-color: rgba(168,85,247,0.25); color: white; }

    .reader-img { width: 100%; border-radius: 8px; margin-bottom: 6px; opacity: 0; transition: opacity 0.4s; }
    .reader-img.loaded { opacity: 1; }

    .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 12px; color: white; font-size: 14px; font-weight: 500; z-index: 999; animation: toastIn 0.3s ease-out; max-width: 360px; }
    .toast-success { background: linear-gradient(135deg, #059669, #10b981); }
    .toast-error { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .toast-info { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    #loading-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.85); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    #loading-overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(168,85,247,0.15); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar { width: 240px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a855f7, #ec4899); border-radius: 2px; transition: width 0.3s; }

    .badge-purple { background: rgba(168,85,247,0.12); color: #c084fc; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
    .badge-emerald { background: rgba(16,185,129,0.12); color: #6ee7b7; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
    .badge-size { background: rgba(255,255,255,0.04); color: #94a3b8; padding: 2px 8px; border-radius: 6px; font-size: 11px; }

    .offline-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    .offline-indicator.online { background: #10b981; }
    .offline-indicator.offline { background: #ef4444; }

    @media (max-width: 640px) { .chapter-grid { grid-template-columns: 1fr; } .manga-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    @media (min-width: 641px) and (max-width: 1023px) { .manga-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .manga-grid { grid-template-columns: repeat(5, 1fr); } }
    .downloads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  </style>
</head>
<body class="bg-gradient-main">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="text-sm text-zinc-400" id="loading-text">Yükleniyor...</div>
    <div class="progress-bar mt-2"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <nav class="sticky top-0 z-50 glass" style="border-bottom: 1px solid rgba(168,85,247,0.1);">
    <div class="max-w-7xl mx-auto px-3 py-2.5 flex items-center gap-2 flex-wrap">
      <span onclick="showSection('list'); loadLatest()" class="text-xl font-extrabold tracking-tight cursor-pointer shrink-0" style="background: linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">manhwafuta</span>
      <input type="text" id="nav-url" class="flex-1 min-w-[180px] text-sm" placeholder="Site URL..." onchange="navigateTo(this.value)" onkeydown="if(event.key==='Enter')navigateTo(this.value)">
      <input type="search" id="nav-search" class="w-36 text-sm" placeholder="Ara..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" class="btn-primary text-xs px-3 py-2">Ara</button>
      <button onclick="openDownloads()" id="nav-downloads" class="btn-secondary text-xs whitespace-nowrap">💾 Kaydedilenler</button>
      <button id="install-btn" class="hidden text-xs bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold">+ Yükle</button>
      <button onclick="logout()" class="btn-secondary text-xs">Çıkış</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-3 sm:p-5 min-h-screen">
    <div id="manga-list-section" class="section-enter">
      <div id="manga-grid" class="manga-grid grid gap-3 sm:gap-5"></div>
      <div id="pagination-root" class="flex justify-center gap-3 mt-8"></div>
      <div id="nav-links-root" class="mt-4"></div>
    </div>

    <div id="manga-detail-section" class="section-enter hidden">
      <button onclick="showSection('list')" class="btn-secondary mb-4">← Geri Dön</button>
      <div class="card p-4 sm:p-6">
        <div class="flex flex-col sm:flex-row gap-5">
          <img id="detail-cover" class="w-full sm:w-52 rounded-xl manga-cover" style="aspect-ratio: 3/4;">
          <div class="flex-1 min-w-0">
            <h2 id="detail-title" class="text-xl sm:text-2xl font-bold mb-3" style="background: linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></h2>
            <div class="flex gap-2 mb-4">
              <button id="detail-save-btn" class="hidden btn-primary text-sm px-4 py-2" onclick="saveMangaLocal()">💾 Cihaza Kaydet</button>
              <button id="detail-download-btn" class="hidden btn-secondary text-sm px-4 py-2" onclick="downloadFullManga()">⬇ CBZ İndir</button>
            </div>
            <div id="detail-chapters" class="chapter-grid grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto pr-1"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="reader-section" class="section-enter hidden">
      <div class="glass rounded-xl p-3 mb-3 flex items-center justify-between gap-2 flex-wrap">
        <button id="reader-back-btn" class="btn-secondary text-xs">← Geri</button>
        <span id="reader-chapter-title" class="text-sm font-semibold truncate flex-1 text-center" style="color: #a855f7;"></span>
        <div class="flex gap-2">
          <button id="reader-prev-btn" class="btn-secondary text-xs hidden">← Önceki</button>
          <button id="reader-next-btn" class="btn-secondary text-xs hidden">Sonraki →</button>
          <button id="reader-download-btn" class="hidden btn-primary text-xs px-3 py-1.5" onclick="downloadCurrentChapter()">⬇ CBZ</button>
          <button id="reader-save-btn" class="hidden btn-primary text-xs px-3 py-1.5" style="background: linear-gradient(135deg,#059669,#10b981);" onclick="saveCurrentChapter()">💾 Kaydet</button>
        </div>
      </div>
      <div id="chapter-images" class="flex flex-col gap-1"></div>
      <div class="flex justify-center gap-3 mt-4 pb-8">
        <button id="reader-bottom-prev" class="btn-secondary text-xs hidden">← Önceki Bölüm</button>
        <button id="reader-bottom-next" class="btn-secondary text-xs hidden">Sonraki Bölüm →</button>
      </div>
    </div>

    <div id="downloads-section" class="section-enter hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold" style="background: linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">💾 Kaydedilenler</h2>
        <span id="storage-info" class="text-xs text-zinc-500"></span>
      </div>
      <div id="downloads-grid" class="downloads-grid"></div>
    </div>

    <div id="site-manga-section" class="section-enter hidden">
      <div class="flex items-center justify-between mb-4">
        <button onclick="openDownloads()" class="btn-secondary text-xs">← Kaydedilenler</button>
        <h2 class="text-lg font-bold" style="background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></h2>
      </div>
      <div id="site-manga-grid" class="downloads-grid"></div>
    </div>

    <div id="local-detail-section" class="section-enter hidden">
        <button onclick="_currentSiteOrigin ? openSiteManga(_currentSiteOrigin) : openDownloads()" class="btn-secondary mb-4">← Kaydedilenler</button>
      <div class="card p-4 sm:p-6">
        <div class="flex flex-col sm:flex-row gap-5">
          <img id="local-detail-cover" class="w-full sm:w-52 rounded-xl manga-cover" style="aspect-ratio: 3/4;">
          <div class="flex-1 min-w-0">
            <h2 id="local-detail-title" class="text-xl sm:text-2xl font-bold mb-3" style="background: linear-gradient(135deg,#a855f7,#ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></h2>
            <p id="local-detail-info" class="text-xs text-zinc-500 mb-3"></p>
            <button id="local-detail-delete" class="btn-danger text-sm mb-4 w-full">🗑 Cihazdan Kaldır</button>
            <div id="local-detail-chapters" class="chapter-grid grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto pr-1"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const TUNNEL_URL = window.location.origin + '/api/tunnel?url=';
    const safeEncode = s => btoa(encodeURIComponent(s));
    const safeDecode = s => decodeURIComponent(atob(s));

    let currentPageUrl = '', currentSiteUrl = '', currentMangaUrl = '', currentChapterReferer = '';
    let currentMangaList = [], chaptersList = [], chapterIndex = -1, currentChapterImages = [];
    let currentMangaTitle = '', currentCoverUrl = '', _blobUrls = [], _currentSiteOrigin = '', _localChapterData = null;

    function $(id) { return document.getElementById(id); }

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3500);
    }

    function showLoading(text) { $('loading-text').textContent = text || 'Yükleniyor...'; $('loading-overlay').classList.add('active'); }
    function hideLoading() { $('loading-overlay').classList.remove('active'); }
    function setProgress(pct) { $('progress-fill').style.width = Math.min(pct, 100) + '%'; }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }
    function timeAgo(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'az önce';
      if (mins < 60) return mins + ' dk önce';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + ' saat önce';
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + ' gün önce';
      const months = Math.floor(days / 30);
      return months + ' ay önce';
    }

    function showSection(s) {
      const map = { 'list':'manga-list-section', 'detail':'manga-detail-section', 'reader':'reader-section', 'downloads':'downloads-section', 'site-manga':'site-manga-section', 'local-detail':'local-detail-section' };
      const target = map[s];
      Object.values(map).forEach(id => {
        const el = $(id);
        if (!el) return;
        const match = id === target;
        el.classList.toggle('hidden', !match);
        if (match) { el.classList.remove('section-enter'); void el.offsetHeight; el.classList.add('section-enter'); }
      });
    }

    function getImgSrc(img) {
      return (img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-original') || img.getAttribute('data-lazy') || img.src || '').trim();
    }

    function isContentImg(url) {
      const low = url.toLowerCase();
      if (/logo|avatar|icon|banner|sponsor|advert|popup|thumb|button|social|emoji/.test(low)) return false;
      return /\.(jpg|jpeg|png|webp|avif|gif)(\?|$)/i.test(url);
    }

    function fixUrl(u) {
      u = u.trim();
      if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
      return u;
    }

    function navigateTo(url) { $('nav-url').value = url; loadLatest(url); }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    function doSearch() {
      const q = $('nav-search').value.trim();
      if (!q) return;
      const site = fixUrl($('nav-url').value || '').replace(/\/+$/, '');
      navigateTo(site + '/?s=' + encodeURIComponent(q));
    }

    // ---- IndexedDB ----
    const DB = {
      _db: null,
      _ready: null,
      _open() {
        if (this._ready) return this._ready;
        this._ready = new Promise((resolve, reject) => {
          const rq = indexedDB.open('manhwafuta', 1);
          rq.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('manga')) {
              const store = db.createObjectStore('manga', { keyPath: 'mangaUrl' });
              store.createIndex('downloadedAt', 'downloadedAt');
            }
            if (!db.objectStoreNames.contains('chapters')) {
              const store = db.createObjectStore('chapters', { keyPath: 'chapterUrl' });
              store.createIndex('mangaUrl', 'mangaUrl');
            }
          };
          rq.onsuccess = e => { this._db = e.target.result; resolve(this._db); };
          rq.onerror = e => reject(e.target.error);
        });
        return this._ready;
      },
      async saveManga(info) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('manga', 'readwrite');
          tx.objectStore('manga').put({ ...info, downloadedAt: new Date().toISOString() });
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      },
      async getManga(mangaUrl) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('manga', 'readonly');
          const rq = tx.objectStore('manga').get(mangaUrl);
          rq.onsuccess = () => resolve(rq.result);
          rq.onerror = e => reject(e.target.error);
        });
      },
      async getAllManga() {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('manga', 'readonly');
          const rq = tx.objectStore('manga').getAll();
          rq.onsuccess = () => resolve(rq.result || []);
          rq.onerror = e => reject(e.target.error);
        });
      },
      async deleteManga(mangaUrl) {
        const db = await this._open();
        const tx = db.transaction(['manga','chapters'], 'readwrite');
        tx.objectStore('manga').delete(mangaUrl);
        const idx = tx.objectStore('chapters').index('mangaUrl');
        idx.openCursor(mangaUrl).onsuccess = e => {
          const cursor = e.target.result;
          if (cursor) { cursor.delete(); cursor.continue(); }
        };
        return new Promise((resolve, reject) => {
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      },
      async saveChapter(ch) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('chapters', 'readwrite');
          tx.objectStore('chapters').put({ ...ch, downloadedAt: new Date().toISOString() });
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      },
      async getChapter(chapterUrl) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('chapters', 'readonly');
          const rq = tx.objectStore('chapters').get(chapterUrl);
          rq.onsuccess = () => resolve(rq.result);
          rq.onerror = e => reject(e.target.error);
        });
      },
      async getChaptersByManga(mangaUrl) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('chapters', 'readonly');
          const rq = tx.objectStore('chapters').index('mangaUrl').getAll(mangaUrl);
          rq.onsuccess = () => resolve(rq.result || []);
          rq.onerror = e => reject(e.target.error);
        });
      },
      async getTotalSize() {
        const db = await this._open();
        const chapters = await this.getAllChapters();
        return chapters.reduce((s, c) => s + (c.size || 0), 0);
      },
      async getAllChapters() {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('chapters', 'readonly');
          const rq = tx.objectStore('chapters').getAll();
          rq.onsuccess = () => resolve(rq.result || []);
          rq.onerror = e => reject(e.target.error);
        });
      },
      async deleteChapter(chapterUrl) {
        const db = await this._open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('chapters', 'readwrite');
          tx.objectStore('chapters').delete(chapterUrl);
          tx.oncomplete = () => resolve();
          tx.onerror = e => reject(e.target.error);
        });
      }
    };

    document.addEventListener('DOMContentLoaded', () => loadLatest());

    async function loadLatest(encodedPageUrl) {
      showLoading('Site yükleniyor...');
      let url;
      if (encodedPageUrl) {
        try { url = safeDecode(encodedPageUrl); } catch (_) { url = encodedPageUrl; }
      } else {
        url = $('nav-url').value || 'https://hentaixdickgirl.com';
      }
      url = fixUrl(url);
      currentPageUrl = url;
      try { currentSiteUrl = new URL(url).origin; } catch (_) {}
      $('nav-url').value = url;
      try {
        const res = await fetch(TUNNEL_URL + encodeURIComponent(url));
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        renderMangaGrid(doc, url, encodedPageUrl);
      } catch (e) { toast('Site yüklenemedi: ' + e.message, 'error'); }
      hideLoading();
    }

    function renderMangaGrid(doc, url, encodedPageUrl) {
      const grid = $('manga-grid');
      grid.innerHTML = '';
      currentMangaList = [];
      const patterns = ['/manga/', '/doujin/', '/series/', '/comic/', '/manhwa/', '/manhua/', '/webtoon/', '/hentai/'];
      const items = new Map();
      doc.querySelectorAll('a').forEach(a => {
        const href = a.href || '';
        const img = a.querySelector('img');
        const title = (a.getAttribute('title') || a.innerText || '').trim();
        if (img && patterns.some(p => href.includes(p)) && title && title.length > 1 && !items.has(href)) {
          items.set(href, { href, img: getImgSrc(img), title });
        }
      });
      if (items.size < 4) {
        doc.querySelectorAll('.page-item-detail, .item, .manga-item, .post-item, article').forEach(el => {
          const a = el.querySelector('a'); const img = el.querySelector('img');
          if (a && img && a.href && !items.has(a.href)) {
            const title = a.getAttribute('title') || a.innerText || img.alt || '';
            if (title && title.length > 1) items.set(a.href, { href: a.href, img: getImgSrc(img), title });
          }
        });
      }
      currentMangaList = [...items.values()];
      if (currentMangaList.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-16 text-zinc-600"><div class="text-5xl mb-4 opacity-30">&#x1F4D6;</div><p class="text-lg">Hiç manga bulunamadı</p></div>';
      } else {

    async function openChapter(mUrl, cUrl, title, localMode) {
      showSection('reader');
      showLoading('Bölüm yükleniyor...');
      // Revoke old blob URLs to prevent memory leak
      _blobUrls.forEach(u => URL.revokeObjectURL(u));
      _blobUrls = [];
      let decodedUrl;
      try { decodedUrl = safeDecode(cUrl); } catch (e) { decodedUrl = cUrl; }
      currentChapterUrl = decodedUrl;
      chapterIndex = chaptersList.findIndex(c => c.href === decodedUrl);
      currentChapterReferer = localMode ? mUrl : safeDecode(mUrl);

      const titleText = localMode ? title : safeDecode(title);
      $('reader-chapter-title').textContent = titleText;
      $('reader-back-btn').onclick = () => localMode ? openLocalManga(mUrl) : openMangaDetail(mUrl);
      $('reader-download-btn').classList.remove('hidden');
      $('reader-save-btn').classList.remove('hidden');

      const prevBtn = $('reader-prev-btn'), nextBtn = $('reader-next-btn');
      const bottomPrev = $('reader-bottom-prev'), bottomNext = $('reader-bottom-next');

      if (chapterIndex > 0) {
        prevBtn.classList.remove('hidden'); bottomPrev.classList.remove('hidden');
        const goPrev = () => openChapter(mUrl, safeEncode(chaptersList[chapterIndex - 1].href), safeEncode(chaptersList[chapterIndex - 1].title), localMode);
        prevBtn.onclick = goPrev; bottomPrev.onclick = goPrev;
      } else { prevBtn.classList.add('hidden'); bottomPrev.classList.add('hidden'); }

      if (chapterIndex < chaptersList.length - 1) {
        nextBtn.classList.remove('hidden'); bottomNext.classList.remove('hidden');
        const goNext = () => openChapter(mUrl, safeEncode(chaptersList[chapterIndex + 1].href), safeEncode(chaptersList[chapterIndex + 1].title), localMode);
        nextBtn.onclick = goNext; bottomNext.onclick = goNext;
      } else { nextBtn.classList.add('hidden'); bottomNext.classList.add('hidden'); }

      const imgContainer = $('chapter-images');
      imgContainer.innerHTML = '';

      try {
        // Try local first
        const localCh = await DB.getChapter(decodedUrl);
        if (localCh?.images?.length > 0) {
          hideLoading();
          currentChapterImages = localCh.images.map(i => i.url);
          _localChapterData = localCh.images;
          $('reader-save-btn').classList.add('hidden');
          // Show as online URLs but with local blob fallback
          for (const img of localCh.images) {
            const el = document.createElement('img');
            el.className = 'reader-img w-full rounded-lg mb-1';
            el.loading = 'lazy';
            el.src = img.url;
            el.onload = function () { this.classList.add('loaded'); };
            el.onerror = function () {
              if (img.data && this.src !== URL.createObjectURL(img.data)) {
                const blobUrl = URL.createObjectURL(img.data);
                _blobUrls.push(blobUrl);
                this.src = blobUrl;
              } else { this.style.display = 'none'; }
            };
            imgContainer.appendChild(el);
          }
          return;
        }

        // Network
        const res = await fetch(TUNNEL_URL + encodeURIComponent(decodedUrl));
        const html = await res.text();
        let images = extractChapterImages(html);
        currentChapterImages = images;

        if (images.length === 0) {
          imgContainer.innerHTML = '<p class="text-zinc-500 text-center py-16 text-sm">Resimler bulunamadı.</p>';
        } else {
          hideLoading();
          images.forEach(src => {
            const img = document.createElement('img');
            img.className = 'reader-img w-full rounded-lg mb-1';
            img.loading = 'lazy';
            let retried = false;
            img.onerror = function () { if (!retried) { retried = true; this.src = window.location.origin + '/api/image?url=' + encodeURIComponent(src); } else { this.style.display = 'none'; } };
            img.onload = function () { this.classList.add('loaded'); };
            img.src = src;
            imgContainer.appendChild(img);
          });
        }
      } catch (e) {
        hideLoading();
        imgContainer.innerHTML = '<p class="text-zinc-500 text-center py-16 text-sm">Yükleme hatası: ' + e.message + '</p>';
      }
      hideLoading();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('keydown', e => {
      if ($('reader-section').classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') { const b = $('reader-prev-btn'); if (!b.classList.contains('hidden')) b.click(); }

    function extractChapterImages(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const selectors = ['.reading-content img.wp-manga-chapter-img','.reading-content img','.chapter-content img','.entry-content img','.page-content img','#chapter-content img','.chapter-page img','.text-left img','.comic-page img','#reader img','.chapter-images img','.wp-manga-chapter-img','.chapter-inner img','img.lazyload-ordered','img.wp-manga-chapter-img'];
      for (const sel of selectors) { const imgs = [...doc.querySelectorAll(sel)].map(getImgSrc).filter(s => s && isContentImg(s) && s.startsWith('http')); if (imgs.length > 2) return imgs; }
      let best = null, bestCount = 0;
      doc.querySelectorAll('div, section, main, article').forEach(el => {
        const cnt = [...el.querySelectorAll('img')].filter(img => { const s = getImgSrc(img); return s && isContentImg(s) && s.startsWith('http'); }).length;
        if (cnt > bestCount) { bestCount = cnt; best = el; }
      });
      if (best && bestCount > 0) return [...best.querySelectorAll('img')].map(getImgSrc).filter(s => s && isContentImg(s) && s.startsWith('http'));
      const all = [...doc.querySelectorAll('img')].map(getImgSrc).filter(s => s && isContentImg(s) && s.startsWith('http'));
      if (all.length > 0) return all;
      const re = /https?:\/\/[^\s"'<>()]+\.(?:jpg|jpeg|png|webp|avif|gif)(?:\?[^\s"'<>()]*)?/gi;
      const m = html.match(re);
      return m ? [...new Set(m)].filter(isContentImg) : [];
    }

    // ---- Local Save ----
    async function fetchImageAsBlob(url, referer) {
      const proxyUrl = window.location.origin + '/api/image?url=' + encodeURIComponent(url);
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('Fetch failed');
      return await res.blob();
    }

    async function saveChapterImages(chapterUrl, chapterTitle, mangaUrl, images, referer) {
      showLoading('Görseller kaydediliyor...');
      const imgData = [];
      let totalSize = 0;
      for (let i = 0; i < images.length; i++) {
        $('loading-text').textContent = `Görsel ${i + 1}/${images.length} kaydediliyor...`;
        setProgress(((i + 1) / images.length) * 100);
        try {
          const blob = await fetchImageAsBlob(images[i], referer);
          imgData.push({ url: images[i], data: blob });
          totalSize += blob.size;
        } catch (_) {
          imgData.push({ url: images[i], data: null });
        }
      }
      await DB.saveChapter({ chapterUrl, chapterTitle, mangaUrl, images: imgData, size: totalSize, downloadedAt: new Date().toISOString() });
      // Update manga record
      await DB.saveManga({ mangaUrl, title: currentMangaTitle, coverUrl: currentCoverUrl });
      hideLoading();
      setProgress(0);
      return imgData.length;
    }

    async function saveCurrentChapter() {
      if (!currentChapterUrl || currentChapterImages.length === 0) { toast('Önce bölümü açın.', 'error'); return; }
      const title = $('reader-chapter-title').textContent || 'Bölüm';
      const count = await saveChapterImages(currentChapterUrl, title, currentMangaUrl, currentChapterImages, currentChapterReferer);
      toast(count + ' görsel cihaza kaydedildi!', 'success');
    }

    async function saveMangaLocal() {
      if (chaptersList.length === 0) { toast('Bölüm listesi bulunamadı.', 'error'); return; }
      const chapters = [...chaptersList];
      let totalSuccess = 0, totalFailed = 0;
      showLoading('Cihaza kaydediliyor... 0/' + chapters.length);

      // Save manga metadata first
      await DB.saveManga({ mangaUrl: currentMangaUrl, title: currentMangaTitle, coverUrl: currentCoverUrl });

      for (let i = 0; i < chapters.length; i++) {
        const ch = chapters[i];
        try {
          // Check if already saved
          const existing = await DB.getChapter(ch.href);
          if (existing?.images?.length > 0) { totalSuccess += existing.images.length; continue; }

          $('loading-text').textContent = `Bölüm ${i + 1}/${chapters.length} taranıyor...`;
          setProgress(((i) / chapters.length) * 100);
          const res = await fetch(TUNNEL_URL + encodeURIComponent(ch.href));
          const html = await res.text();
          const images = extractChapterImages(html);
          if (images.length === 0) { totalFailed++; continue; }

          // Save with blobs
          const imgData = [];
          for (let j = 0; j < images.length; j++) {
            $('loading-text').textContent = `Bölüm ${i + 1}/${chapters.length} - Görsel ${j + 1}/${images.length}`;
            setProgress(((i + (j + 1) / images.length) / chapters.length) * 100);
            try {
              const blob = await fetchImageAsBlob(images[j], ch.href);
              imgData.push({ url: images[j], data: blob });
              totalSuccess++;
            } catch (_) { imgData.push({ url: images[j], data: null }); totalFailed++; }
          }
          const totalSize = imgData.reduce((s, d) => s + (d.data?.size || 0), 0);
          await DB.saveChapter({ chapterUrl: ch.href, chapterTitle: ch.title, mangaUrl: currentMangaUrl, images: imgData, size: totalSize });
        } catch (e) { totalFailed++; }
      }
      hideLoading();
      setProgress(0);
      toast(`${totalSuccess} görsel kaydedildi${totalFailed > 0 ? `, ${totalFailed} hatalı` : ''}`, totalFailed > totalSuccess ? 'error' : 'success');
    }

        wrapper.appendChild(chk);
        wrapper.appendChild(btn);
        chDiv.appendChild(wrapper);
      });

      const bottomBar = document.createElement('div');
      bottomBar.className = 'flex items-center gap-3 mt-3';
      const selAllLabel = document.createElement('label');
      selAllLabel.className = 'flex items-center gap-2 text-xs text-zinc-400 cursor-pointer';
      const selAllChk = document.createElement('input');
      selAllChk.type = 'checkbox';
      selAllChk.className = 'accent-purple-500';
      selAllLabel.appendChild(selAllChk);
      selAllLabel.appendChild(document.createTextNode('Tümünü Seç'));
      const delSelBtn = document.createElement('button');
      delSelBtn.className = 'btn-danger text-xs hidden';
      delSelBtn.textContent = '🗑 Seçilenleri Sil';
      selAllChk.onchange = () => { chDiv.querySelectorAll('.chapter-checkbox').forEach(cb => cb.checked = selAllChk.checked); updateDel(); };
      function updateDel() { delSelBtn.classList.toggle('hidden', !chDiv.querySelector('.chapter-checkbox:checked')); }
      chDiv.querySelectorAll('.chapter-checkbox').forEach(cb => cb.onchange = updateDel);
      delSelBtn.onclick = async () => {
        const selected = [...chDiv.querySelectorAll('.chapter-checkbox:checked')].map(cb => cb.dataset.chapterUrl);
        if (selected.length === 0) return;
        if (!confirm(`${selected.length} bölümü silmek istediğinize emin misiniz?`)) return;
        showLoading('Siliniyor...');
        for (const url of selected) await DB.deleteChapter(url);
        hideLoading();
        toast(`${selected.length} bölüm silindi.`, 'info');
        openLocalManga(mangaUrl);
      };
      bottomBar.appendChild(selAllLabel);
      bottomBar.appendChild(delSelBtn);
      chDiv.appendChild(bottomBar);
      hideLoading();
    }

    // ---- Download CBZ ----
    async function downloadCurrentChapter() {
      if (currentChapterImages.length === 0) { toast('Önce bölümü açın.', 'error'); return; }
      const manga = decodeURIComponent(currentMangaUrl.split('/').filter(Boolean).pop() || '');
      const title = $('reader-chapter-title').textContent || 'Bölüm';
      const filename = [manga, title].filter(Boolean).join(' - ').replace(/\s+/g, ' ').trim() || 'chapter';

      let coverEntry = null;
      if (currentCoverUrl) {
        try {
          const r = await fetch('/api/image?url=' + encodeURIComponent(currentCoverUrl));
          if (r.ok) {
            const blob = await r.blob();
            const base64 = await blobToBase64(blob);
            const ext = currentCoverUrl.match(/\.(\w+)(\?|$)/)?.[1] || 'jpg';
            coverEntry = { data: base64, ext };
          }
        } catch (_) {}
      }

      if (_localChapterData?.length > 0) {
        showLoading('CBZ hazırlanıyor...');
        const imageData = [];
        if (coverEntry) imageData.push(coverEntry);
        for (const img of _localChapterData) {
          if (img.data) {
            const base64 = await blobToBase64(img.data);
            const ext = img.url.match(/\.(\w+)(\?|$)/)?.[1] || 'jpg';
            imageData.push({ data: base64, ext });
          }
        }
        try {
          const r = await fetch('/api/download-images', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ images: imageData, filename })
          });
          if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Hata'); }
          const blob = await r.blob();
          hideLoading(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename + '.cbz'; a.click(); URL.revokeObjectURL(a.href);
          toast('CBZ tamam!', 'success');
        } catch (e) { hideLoading(); toast('Hata: ' + e.message, 'error'); }
        return;
      }

      const images = [];
      if (coverEntry) images.push(coverEntry);
      currentChapterImages.forEach(url => images.push({ url, referer: currentChapterReferer }));
      showLoading('CBZ hazırlanıyor...');
      fetch('/api/download-images', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images, filename })
      }).then(r => { if (!r.ok) return r.json().then(e => { throw new Error(e.error || 'Hata'); }); return r.blob(); })
        .then(blob => { hideLoading(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename + '.cbz'; a.click(); URL.revokeObjectURL(a.href); toast('CBZ indirme tamam!', 'success'); })
        .catch(e => { hideLoading(); toast('Hata: ' + e.message, 'error'); });
    }

    async function downloadFullManga() {
      if (chaptersList.length === 0) { toast('Bölüm listesi bulunamadı.', 'error'); return; }
      const name = decodeURIComponent(currentMangaUrl.split('/').filter(Boolean).pop() || 'manga');
      const chapters = [...chaptersList].reverse();
      const allImages = []; let failed = 0;

      if (currentCoverUrl) {
        try {
          const r = await fetch('/api/image?url=' + encodeURIComponent(currentCoverUrl));
          if (r.ok) {
            const blob = await r.blob();
            const base64 = await blobToBase64(blob);
            const ext = currentCoverUrl.match(/\.(\w+)(\?|$)/)?.[1] || 'jpg';
            allImages.push({ data: base64, ext });
          }
        } catch (_) {}
      }

      showLoading('Tüm bölümler taranıyor... 0/' + chapters.length);
      for (let i = 0; i < chapters.length; i++) {
        $('loading-text').textContent = `Taranıyor... ${i + 1}/${chapters.length}${failed > 0 ? ` (${failed} hatalı)` : ''}`;
        try {
          const res = await fetch(TUNNEL_URL + encodeURIComponent(chapters[i].href));
          const html = await res.text();
          const images = extractChapterImages(html);
          if (images.length === 0) { failed++; continue; }
          images.forEach(url => allImages.push({ url, referer: chapters[i].href }));
        } catch (e) { failed++; }
      }
      if (allImages.length === 0) { hideLoading(); toast('Hiç resim bulunamadı.', 'error'); return; }
      $('loading-text').textContent = 'CBZ oluşturuluyor... (' + allImages.length + ' resim)';
      const filename = name.replace(/[^\w\- ]/g, '').trim() + ' - All Chapters';
      try {
        const r = await fetch('/api/download-images', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ images: allImages, filename }) });
        if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Hata'); }
        const blob = await r.blob();
        hideLoading(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename + '.cbz'; a.click(); URL.revokeObjectURL(a.href);
        toast('CBZ tamam! ' + (failed > 0 ? `(${failed} bölüm atlandı)` : ''), 'success');
      } catch (e) { hideLoading(); toast('Hata: ' + e.message, 'error'); }
    }

    // ---- PWA ----
    let deferredPrompt = null;
    const installBtn = $('install-btn');
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden');
      installBtn.onclick = async () => { installBtn.classList.add('hidden'); deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; };
    });
    window.addEventListener('appinstalled', () => { deferredPrompt = null; installBtn.classList.add('hidden'); });
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  </script>
</body>
