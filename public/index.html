<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temiz Manhwa Oku - Reklamsız</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f12; color: #e4e4e7; }
    </style>
</head>
<body>

    <nav class="bg-zinc-900 p-4 text-center border-b border-zinc-800 sticky top-0 z-50 shadow-md">
        <h1 class="text-2xl font-bold text-amber-500 cursor-pointer tracking-wider" onclick="loadLatest()">TEMİZ MANHWA</h1>
    </nav>

    <main class="container mx-auto p-4 min-h-screen">
        <div id="manga-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

        <div id="reader-area" class="hidden max-w-2xl mx-auto">
            <div class="flex justify-between items-center my-4">
                <button onclick="closeReader()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded transition">← Listeye Dön</button>
                <span id="chapter-title" class="font-semibold text-amber-500"></span>
            </div>
            <div id="chapter-images" class="flex flex-col gap-1 bg-black p-2 rounded shadow-2xl"></div>
        </div>
    </main>

    <script>
        // Render'da veya yerelde çalışırken URL'i otomatik algılar
        const API_URL = `${window.location.origin}/api`;

        async function loadLatest() {
            document.getElementById('manga-list').classList.remove('hidden');
            document.getElementById('reader-area').classList.add('hidden');
            
            const listDiv = document.getElementById('manga-list');
            listDiv.innerHTML = '<p class="text-center col-span-full text-zinc-400">Manhwalar yükleniyor...</p>';
            
            try {
                const res = await fetch(`${API_URL}/latest`);
                const data = await res.json();
                
                listDiv.innerHTML = '';
                data.forEach(manga => {
                    listDiv.innerHTML += `
                        <div class="bg-zinc-900 rounded-lg overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition duration-300 border border-zinc-800" onclick="openChapter('${manga.slug}', 'chapter-1')">
                            <img src="${manga.img}" class="w-full h-72 object-cover" alt="${manga.title}">
                            <div class="p-3">
                                <h3 class="text-sm font-bold text-center line-clamp-2 text-zinc-200">${manga.title}</h3>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                listDiv.innerHTML = '<p class="text-center col-span-full text-red-500">Veri çekme başarısız oldu. Kaynak site engellemiş olabilir.</p>';
            }
        }

        async function openChapter(mangaSlug, chapterSlug) {
            document.getElementById('manga-list').classList.add('hidden');
            document.getElementById('reader-area').classList.remove('hidden');
            
            document.getElementById('chapter-title').innerText = `${mangaSlug} - ${chapterSlug}`;
            const imgContainer = document.getElementById('chapter-images');
            imgContainer.innerHTML = '<p class="text-center p-8 text-zinc-400">Sayfalar yükleniyor, lütfen bekleyin...</p>';

            try {
                const res = await fetch(`${API_URL}/chapter/${mangaSlug}/${chapterSlug}`);
                const data = await res.json();
                
                imgContainer.innerHTML = '';
                if(data.images.length === 0) {
                    imgContainer.innerHTML = '<p class="text-center p-4 text-amber-500">Bu bölümün resimleri çekilemedi (Koruma olabilir).</p>';
                    return;
                }
                data.images.forEach(imgUrl => {
                    imgContainer.innerHTML += `<img src="${imgUrl}" class="w-full h-auto block" loading="lazy" alt="Manga Sayfası">`;
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                imgContainer.innerHTML = '<p class="text-center text-red-500 p-4">Bölüm yüklenirken bir hata oluştu.</p>';
            }
        }

        function closeReader() {
            loadLatest();
        }

        loadLatest();
    </script>
</body>
</html>
