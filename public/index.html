<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            color: #667eea;
            display: none;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 30px;
        }

        .manga-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .manga-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .manga-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .manga-info {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Manhwa Scraper</h1>
        <p class="subtitle">Search and discover your favorite manhwa</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for manhwa...">
            <button onclick="searchManhwa()">Search</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="empty-state">Start searching to find manhwa</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        // Search on Enter key
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchManhwa();
        });

        async function searchManhwa() {
            const query = searchInput.value.trim();
            if (!query) {
                showError('Please enter a search term');
                return;
            }

            loading.style.display = 'block';
            error.style.display = 'none';
            results.innerHTML = '';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.error) {
                    showError(data.error);
                    return;
                }

                if (data.length === 0) {
                    results.innerHTML = '<div class="empty-state">No results found. Try a different search term.</div>';
                    return;
                }

                displayResults(data);
            } catch (err) {
                loading.style.display = 'none';
                showError('Failed to fetch results. Please try again.');
                console.error(err);
            }
        }

        function displayResults(data) {
            results.innerHTML = data.map(item => `
                <div class="manga-card">
                    <div class="manga-title">${item.title || 'Unknown Title'}</div>
                    <div class="manga-info">
                        ${item.author ? `<div>👤 Author: ${item.author}</div>` : ''}
                        ${item.status ? `<div>📊 Status: ${item.status}</div>` : ''}
                        ${item.rating ? `<div>⭐ Rating: ${item.rating}</div>` : ''}
                        ${item.description ? `<div>📝 ${item.description}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
