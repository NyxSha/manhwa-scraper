<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> 
    <title>MASTER BYPASS READER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0c0e; color: #e4e4e7; font-family: sans-serif; }
    </style>
</head>
<body>

    <input type="hidden" id="target-site" value="https://hentaixdickgirl.com">
    <div id="app-content">
        <nav class="bg-zinc-900 px-3 py-2 border-b border-zinc-800 sticky top-0 z-40">
            <div class="flex items-center gap-2 flex-wrap">
                <h1 class="text-lg font-bold text-amber-500 cursor-pointer shrink-0" onclick="showSection('list'); loadLatest()">MASTER READER</h1>
                <input type="text" id="nav-url" class="flex-1 min-w-[200px] bg-zinc-950 border border-zinc-700 rounded px-2.5 py-1.5 text-sm text-white" placeholder="Site URL..." onchange="navigateTo(this.value)">
                <input type="text" id="nav-search" class="w-40 bg-zinc-950 border border-zinc-700 rounded px-2.5 py-1.5 text-sm text-white" placeholder="Ara..." onkeydown="if(event.key==='Enter')doSearch()">
                <button onclick="doSearch()" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 px-3 py-1.5 rounded text-sm font-bold">Ara</button>
                <button onclick="logout()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded text-zinc-400 hover:text-white">Logout</button>
            </div>
        </nav>
        
        <main class="container mx-auto p-4 min-h-screen">
            <div id="manga-list-section" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            
            <div id="manga-detail-section" class="hidden max-w-4xl mx-auto bg-zinc-900/50 p-6 rounded-xl border border-zinc-800">
                <button onclick="showSection('list')" class="bg-zinc-800 px-4 py-2 rounded text-sm mb-6">← Geri Dön</button>
                <div class="flex flex-col md:flex-row gap-6">
                    <img id="detail-cover" class="w-48 h-68 object-cover rounded-lg border border-zinc-700">
                    <div class="flex-1">
                        <h2 id="detail-title" class="text-2xl font-bold text-amber-500 mb-4"></h2>
                        <div id="detail-chapters" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
            
            <div id="reader-section" class="hidden max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-4 bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                    <button id="reader-back-btn" class="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded text-sm">← Geri</button>
                    <span id="reader-chapter-title" class="text-amber-500 text-sm truncate"></span>
                </div>
                <div id="chapter-images" class="flex flex-col bg-black p-1"></div>
            </div>
        </main>
    </div>

    <script>
        const TUNNEL_URL = `${window.location.origin}/api/tunnel?url=`;
        const safeEncode = (str) => btoa(encodeURIComponent(str));
        const safeDecode = (str) => decodeURIComponent(atob(str));
        let currentPageUrl = '';
        let currentMangaList = [];
        let currentSiteUrl = '';

        function showSection(s) {
            document.getElementById('manga-list-section').classList.toggle('hidden', s !== 'list');
            document.getElementById('manga-detail-section').classList.toggle('hidden', s !== 'detail');
            document.getElementById('reader-section').classList.toggle('hidden', s !== 'reader');
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLatest();
        });

        function getImgSrc(img) {
            return (img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('data-original') || img.getAttribute('data-lazy') || img.getAttribute('data-srcset') || img.src || '').trim();
        }

        function isLikelyContent(url) {
            const low = url.toLowerCase();
            if (low.includes('logo') || low.includes('avatar') || low.includes('icon') || low.includes('banner') || low.includes('sponsor') || low.includes('advert') || low.includes('popup') || low.includes('thumb') || low.includes('button') || low.includes('social')) {
                return false;
            }
            const match = url.match(/\.(jpg|jpeg|png|webp|avif|gif)(\?.*)?$/i);
            return !!match;
        }

        function doSearch() {
            const query = document.getElementById('nav-search').value.trim();
            if (!query) return;
            const site = document.getElementById('target-site').value.replace(/\/+$/, '');
            navigateTo(site + '/?s=' + query);
        }

        // Extract chapter images using DOM selectors with intelligent fallback
        function extractChapterImages(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            let images = [];

            // Strategy 1: Known content area selectors (most WordPress manga sites)
            const contentSelectors = [
                '.reading-content img.wp-manga-chapter-img', '.reading-content img', 
                '.chapter-content img', '.entry-content img',
                '.page-content img', '#chapter-content img', '.chapter-page img',
                '.text-left img', '.comic-page img', '#reader img',
                '.chapter-images img', '.wp-manga-chapter-img', 
                '.main-content img', '.site-content img', '#content img',
                'article img', 'main img', '.post-content img',
                '.entry-content p img', '.chapter-container img',
                '.page-break img', '.comic img', '.manga-chapter img',
                '.chapter-inner img', 'img.lazyload-ordered', 'img.wp-manga-chapter-img'
            ];

            for (const selector of contentSelectors) {
                const found = doc.querySelectorAll(selector);
                const valid = [...found].map(getImgSrc).filter(s => s && isLikelyContent(s) && s.startsWith('http'));
                if (valid.length > 2) {
                    return valid;
                }
            }

            // Strategy 2: Find the container with the most images
            const allElements = doc.querySelectorAll('div, section, main, article');
            let bestContainer = null;
            let bestCount = 0;
            allElements.forEach(el => {
                const imgs = el.querySelectorAll('img');
                const count = [...imgs].filter(img => {
                    const src = getImgSrc(img);
                    return src && isLikelyContent(src) && src.startsWith('http');
                }).length;
                if (count > bestCount) {
                    bestCount = count;
                    bestContainer = el;
                }
            });

            if (bestContainer && bestCount > 0) {
                images = [...bestContainer.querySelectorAll('img')].map(getImgSrc).filter(s => s && isLikelyContent(s) && s.startsWith('http'));
                if (images.length > 0) return images;
            }

            // Strategy 3: Get all images and filter aggressively
            images = [...doc.querySelectorAll('img')].map(getImgSrc).filter(s => s && isLikelyContent(s) && s.startsWith('http'));
            if (images.length > 0) return images;

            // Strategy 4: Regex fallback with improved filtering
            const imgRegex = /https?:\/\/[^\s"'<>()]+\.(?:jpg|jpeg|png|webp|avif|gif)(?:\?[^\s"'<>()]*)?/gi;
            const matches = html.match(imgRegex);
            if (matches) {
                return [...new Set(matches)].filter(u => isLikelyContent(u));
            }

            return [];
        }

        function navigateTo(url) {
            document.getElementById('nav-url').value = url;
            loadLatest(url);
        }

        async function loadLatest(encodedPageUrl) {
            let url;
            if (encodedPageUrl) {
                try {
                    url = safeDecode(encodedPageUrl);
                } catch(e) {
                    url = encodedPageUrl;
                }
            } else {
                url = document.getElementById('target-site').value;
            }
            currentPageUrl = url;
            currentSiteUrl = new URL(url).origin;
            document.getElementById('nav-url').value = url;
            const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(url)}`);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const listDiv = document.getElementById('manga-list-section');
            listDiv.innerHTML = '';
            
            currentMangaList = [];

            // Try common manga link patterns
            const knownPatterns = ['/manga/', '/doujin/', '/series/', '/comic/', '/manhwa/', '/manhua/', '/webtoon/', '/hentai/'];
            
            doc.querySelectorAll('a').forEach(a => {
                const href = a.href || '';
                const img = a.querySelector('img');
                const matchPattern = knownPatterns.some(p => href.includes(p));
                // Also match any link that looks like a content page (not home, not category)
                const isContentLink = matchPattern || (href.includes('/') && !href.includes('#') && !href.startsWith('javascript'));
                const title = (a.getAttribute('title') || a.innerText || '').trim();
                
                if (img && isContentLink && title && title.length > 1) {
                    const item = { href, img: getImgSrc(img), title };
                    currentMangaList.push(item);
                }
            });

            // If too few results, also try direct image+link pairs (some sites use different structures)
            if (currentMangaList.length < 4) {
                doc.querySelectorAll('.page-item-detail, .item, .manga-item, .post-item, article').forEach(el => {
                    const a = el.querySelector('a');
                    const img = el.querySelector('img');
                    if (a && img && a.href) {
                        const href = a.href;
                        const title = a.getAttribute('title') || a.innerText || img.alt || '';
                        if (title && title.length > 1 && !currentMangaList.some(m => m.href === href)) {
                            currentMangaList.push({ href, img: getImgSrc(img), title });
                        }
                    }
                });
            }

            // Deduplicate
            const seen = new Set();
            currentMangaList = currentMangaList.filter(m => {
                if (seen.has(m.href)) return false;
                seen.add(m.href);
                return true;
            });

            currentMangaList.forEach(m => {
                listDiv.innerHTML += `
                    <div class="cursor-pointer" onclick="openMangaDetail('${safeEncode(m.href)}')">
                        <img src="${m.img}" class="w-full rounded mb-2" loading="lazy" onerror="this.parentElement.style.display='none'">
                        <h3 class="text-xs truncate">${m.title}</h3>
                    </div>`;
            });

            if (currentMangaList.length === 0) {
                listDiv.innerHTML = '<p class="col-span-full text-zinc-500 text-center p-8">Hiç manga bulunamadı. Site yapısı farklı olabilir.</p>';
            }

            // Pagination - find next page link
            const nextSelectors = ['a.next', 'a.next-page', 'a[rel="next"]', '.next a', '.pagination .next a', '.nav-links a.next', '.page-nav a.next', 'a:has(span:contains("Next"))'];
            let nextUrl = null;
            for (const sel of nextSelectors) {
                try {
                    const el = doc.querySelector(sel);
                    if (el && el.href) { nextUrl = el.href; break; }
                } catch(e) {}
            }
            // Also try to find pagination by text
            if (!nextUrl) {
                doc.querySelectorAll('a').forEach(a => {
                    const text = (a.innerText || '').trim().toLowerCase();
                    if ((text === 'next' || text === 'ileri' || text === 'sonraki' || text === '→' || text === '»') && a.href) {
                        nextUrl = a.href;
                    }
                });
            }

            // Remove old pagination buttons then add new ones
            listDiv.parentElement.querySelectorAll('.pagination-controls').forEach(el => el.remove());
            const paginationDiv = document.createElement('div');
            paginationDiv.className = 'pagination-controls col-span-full flex justify-center gap-4 mt-6';
            if (nextUrl) {
                paginationDiv.innerHTML += `<button onclick="loadLatest('${safeEncode(nextUrl)}')" class="bg-amber-600 hover:bg-amber-500 text-zinc-950 px-6 py-2 rounded font-bold text-sm">Sonraki Sayfa →</button>`;
            }
            if (encodedPageUrl) {
                paginationDiv.innerHTML += `<button onclick="loadLatest()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-2 rounded font-bold text-sm">← Ana Sayfa</button>`;
            }
            if (paginationDiv.children.length > 0) {
                listDiv.parentElement.appendChild(paginationDiv);
            }

            // Extract navigation/menu links from the site
            const existingNav = listDiv.parentElement.querySelector('.site-nav-links');
            if (existingNav) existingNav.remove();
            const navLinks = [];
            doc.querySelectorAll('.navbar-nav a, .main-nav a, .menu-menu a, nav a, .navigation a').forEach(a => {
                const href = a.href || '';
                const text = (a.innerText || '').trim();
                if (href && text && text.length < 30 && href.startsWith(currentSiteUrl) && !href.includes('#') && !navLinks.some(n => n.href === href)) {
                    navLinks.push({ href, text });
                }
            });
            if (navLinks.length > 0) {
                const navDiv = document.createElement('div');
                navDiv.className = 'site-nav-links col-span-full flex flex-wrap gap-2 mt-4 p-3 bg-zinc-900/50 rounded-lg border border-zinc-800';
                navLinks.slice(0, 20).forEach(n => {
                    navDiv.innerHTML += `<button onclick="loadLatest('${safeEncode(n.href)}')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1 rounded text-xs">${n.text}</button>`;
                });
                listDiv.parentElement.appendChild(navDiv);
            }
        }

        async function openMangaDetail(encodedUrl) {
            showSection('detail');
            const url = safeDecode(encodedUrl);
            const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(url)}`);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            
            // Title
            const titleEl = doc.querySelector('h1') || doc.querySelector('.post-title h1') || doc.querySelector('.entry-title') || doc.querySelector('[itemprop="name"]');
            document.getElementById('detail-title').innerText = titleEl?.innerText || 'Detay';
            
            // Cover
            const coverSelectors = ['.summary_image img', '.poster img', '.thumb img', '.cover img', '[itemprop="image"]', '.entry-content img:first-child', 'article img'];
            for (const sel of coverSelectors) {
                const el = doc.querySelector(sel);
                if (el) { document.getElementById('detail-cover').src = getImgSrc(el); break; }
            }
            
            // Chapters
            const chaptersDiv = document.getElementById('detail-chapters');
            chaptersDiv.innerHTML = '';
            
            // Try multiple chapter list selectors
            const chapterSelectors = [
                'li.wp-manga-chapter a', '.chapter-list a', '.chap-list a',
                '.cl-style ul li a', '.chapter-item a', '#chapters a',
                '.listing-chapters_wrap a', 'ul.main li a', '.chapter a',
                'table a[href*="/chapter/"]', 'a[href*="/chapter/"]',
                'a[href*="/bolum/"]', 'a[href*="/bölüm/"]', 'a[href*="/read/"]'
            ];
            
            let chapterLinks = [];
            for (const sel of chapterSelectors) {
                const found = doc.querySelectorAll(sel);
                if (found.length > 0) {
                    chapterLinks = [...found];
                    break;
                }
            }
            
            // Also try any link containing common chapter keywords
            if (chapterLinks.length === 0) {
                doc.querySelectorAll('a').forEach(a => {
                    const text = (a.innerText || '').trim().toLowerCase();
                    const href = a.href || '';
                    if ((text.includes('chapter') || text.includes('bolum') || text.includes('bölüm') || text.match(/ch\.?\s*\d+/) || text.match(/c\.?\s*\d+/)) && href) {
                        chapterLinks.push(a);
                    }
                });
            }
            
            // Fallback 1: check for read-first/read-last buttons
            if (chapterLinks.length === 0) {
                const readBtns = doc.querySelectorAll('#btn-read-first, #btn-read-last, .c-btn[href*="/manga/"]');
                readBtns.forEach(a => {
                    const href = a.href || '';
                    const text = a.innerText || a.title || 'Bölüm';
                    if (href && !chapterLinks.some(l => l.href === href)) {
                        chapterLinks.push(a);
                    }
                });
            }

            // Fallback 2: fetch chapters from server-side API
            if (chapterLinks.length === 0) {
                try {
                    const apiRes = await fetch(`/api/chapters?url=${encodeURIComponent(url)}`);
                    const apiData = await apiRes.json();
                    if (apiData.chapters && apiData.chapters.length > 0) {
                        apiData.chapters.forEach(ch => {
                            const a = doc.createElement('a');
                            a.href = ch.href;
                            a.innerText = ch.title;
                            chapterLinks.push(a);
                        });
                    }
                } catch (e) {}
            }
            
            if (chapterLinks.length === 0) {
                chaptersDiv.innerHTML = '<p class="text-zinc-500 p-4">Bölüm bulunamadı.</p>';
            } else {
                chapterLinks.forEach(a => {
                    const href = a.href || '';
                    if (href) {
                        chaptersDiv.innerHTML += `<button onclick="openChapter('${encodedUrl}', '${safeEncode(href)}', '${safeEncode(a.innerText.trim())}')" class="bg-zinc-800 p-2 text-xs rounded truncate">${a.innerText.trim()}</button>`;
                    }
                });
            }
        }

        function proxyImg(url) {
            return `${window.location.origin}/api/image?url=${encodeURIComponent(url)}`;
        }

        async function openChapter(mUrl, cUrl, title) {
            showSection('reader');
            document.getElementById('reader-chapter-title').innerText = safeDecode(title);
            document.getElementById('reader-back-btn').onclick = () => openMangaDetail(mUrl);
            const chapterImages = document.getElementById('chapter-images');
            chapterImages.innerHTML = '<p class="text-zinc-500 text-center p-8">Yükleniyor...</p>';
            
            const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(safeDecode(cUrl))}`);
            const html = await res.text();
            
            let images = extractChapterImages(html);
            
            chapterImages.innerHTML = '';
            if (images.length > 0) {
                // Try direct first, fall back to proxy on error
                images.forEach(src => {
                    const img = document.createElement('img');
                    img.className = 'w-full mb-1';
                    img.loading = 'lazy';
                    let retried = false;
                    img.onerror = function() {
                        if (!retried) {
                            retried = true;
                            this.src = proxyImg(src);
                        } else {
                            this.style.display = 'none';
                        }
                    };
                    img.src = src;
                    chapterImages.appendChild(img);
                });
            } else {
                chapterImages.innerHTML = '<p class="text-zinc-500 text-center p-4">Resimler bulunamadı. JS koruması veya farklı site yapısı olabilir.</p>';
            }
        }
    </script>
</body>
</html>
