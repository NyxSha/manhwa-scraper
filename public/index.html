<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Manhwa Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0b0e; color: #e4e4e7; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ VE AYAR EKRANI (AUTH PANEL) -->
    <div id="auth-panel" class="fixed inset-0 bg-zinc-950 flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold text-amber-500 mb-4 text-center tracking-wider">GİZLİ ERİŞİM PANELİ</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Giriş Kodu</label>
                    <input type="password" id="secret-code" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-amber-500 text-center" placeholder="••••••">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Hedef Manhwa Sitesi URL (Örn: https://manhwatop.com)</label>
                    <input type="text" id="target-site" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-amber-500" value="https://manhwatop.com">
                </div>
                <button onclick="verifyAndConnect()" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold p-3 rounded transition mt-2">Sisteme Bağlan</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden">Hatalı gizli kod!</p>
            </div>
        </div>
    </div>

    <!-- MAIN UYGULAMA (Giriş yapıldıktan sonra açılır) -->
    <div id="app-content" class="hidden">
        <nav class="bg-zinc-900 p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 z-40 shadow-md">
            <h1 class="text-xl font-bold text-amber-500 cursor-pointer" onclick="loadLatest()">TEMİZ OKUYUCU</h1>
            <button onclick="lockSystem()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded text-zinc-400 hover:text-white">Sistemi Kilitle</button>
        </nav>

        <main class="container mx-auto p-4 min-h-screen">
            <!-- Manhwa Listesi -->
            <div id="manga-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

            <!-- Okuma Alanı -->
            <div id="reader-area" class="hidden max-w-2xl mx-auto">
                <div class="flex justify-between items-center my-4">
                    <button onclick="closeReader()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded transition">← Listeye Dön</button>
                    <span id="chapter-title" class="font-semibold text-amber-500 text-sm truncate max-w-[200px]"></span>
                </div>
                <div id="chapter-images" class="flex flex-col gap-1 bg-black p-2 rounded shadow-2xl"></div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = `${window.location.origin}/api`;
        let systemToken = "";
        let currentTargetUrl = "";

        function verifyAndConnect() {
            const code = document.getElementById('secret-code').value;
            const target = document.getElementById('target-site').value.replace(/\/$/, ""); // Sondaki eğik çizgiyi temizle

            if(code === "123456") { // GİZLİ KODUNUZ BURASI (İstediğin gibi değiştir)
                systemToken = code;
                currentTargetUrl = target;
                
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('auth-error').classList.add('hidden');
                
                loadLatest();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function lockSystem() {
            systemToken = "";
            document.getElementById('secret-code').value = "";
            document.getElementById('auth-panel').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
        }

        async function loadLatest() {
            document.getElementById('manga-list').classList.remove('hidden');
            document.getElementById('reader-area').classList.add('hidden');
            
            const listDiv = document.getElementById('manga-list');
            listDiv.innerHTML = '<p class="text-center col-span-full text-zinc-400 p-12">Kaynak siteden veriler kazınıyor...</p>';
            
            try {
                const res = await fetch(`${API_URL}/latest?target=${encodeURIComponent(currentTargetUrl)}`);
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                listDiv.innerHTML = '';
                data.forEach(manga => {
                    listDiv.innerHTML += `
                        <div class="bg-zinc-900 rounded-lg overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition duration-300 border border-zinc-800" onclick="openChapter('${manga.slug}', 'chapter-1')">
                            <img src="${manga.img}" class="w-full h-72 object-cover" alt="" onerror="this.src='https://placehold.co/300x450/18181b/71717a?text=Resim+Yuklenemedi'">
                            <div class="p-3">
                                <h3 class="text-sm font-bold text-center line-clamp-2 text-zinc-200">${manga.title}</h3>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                listDiv.innerHTML = `
                    <div class="text-center col-span-full p-8 bg-red-950/30 border border-red-900/50 rounded-xl">
                        <p class="text-red-400 font-semibold">Bağlantı Başarısız Olma Sebepleri:</p>
                        <p class="text-xs text-zinc-400 mt-2">1. Site Cloudflare ile tamamen kilitlenmiş olabilir.<br>2. Girdiğiniz URL adresi hatalı veya yapısı farklı olabilir.</p>
                        <button onclick="lockSystem()" class="mt-4 bg-zinc-800 px-4 py-2 rounded text-sm">Başka Link Dene</button>
                    </div>`;
            }
        }

        async function openChapter(mangaSlug, chapterSlug) {
            document.getElementById('manga-list').classList.add('hidden');
            document.getElementById('reader-area').classList.remove('hidden');
            
            document.getElementById('chapter-title').innerText = `${mangaSlug}`;
            const imgContainer = document.getElementById('chapter-images');
            imgContainer.innerHTML = '<p class="text-center p-8 text-zinc-400">Görseller reklamlardan arındırılıyor...</p>';

            try {
                const res = await fetch(`${API_URL}/chapter/${mangaSlug}/${chapterSlug}?target=${encodeURIComponent(currentTargetUrl)}`);
                const data = await res.json();
                
                imgContainer.innerHTML = '';
                if(!data.images || data.images.length === 0) {
                    imgContainer.innerHTML = '<p class="text-center p-8 text-amber-500">Bu bölümün resimleri çekilemedi (Kaynak site korumalı veya bölüm slug yapısı farklı).</p>';
                    return;
                }
                data.images.forEach(imgUrl => {
                    imgContainer.innerHTML += `<img src="${imgUrl}" class="w-full h-auto block" loading="lazy" referrerpolicy="no-referrer">`;
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                imgContainer.innerHTML = '<p class="text-center text-red-500 p-4">Bölüm yüklenirken bir hata oluştu.</p>';
            }
        }

        function closeReader() {
            loadLatest();
        }
    </script>
</body>
</html>
