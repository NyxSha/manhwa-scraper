<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> 
    <title>MASTER BYPASS READER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0c0e; color: #e4e4e7; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="auth-panel" class="fixed inset-0 bg-zinc-950 flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold text-amber-500 mb-4 text-center tracking-wider">DOZER MASTER CORE</h2>
            <div class="space-y-4">
                <input type="password" id="secret-code" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-center text-white" value="123456">
                <input type="text" id="target-site" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-white" value="https://hentaixdickgirl.com">
                <button onclick="verifyAndConnect()" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold p-3 rounded transition">Sistemi Başlat</button>
            </div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <nav class="bg-zinc-900 p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 z-40">
            <h1 class="text-xl font-bold text-amber-500 cursor-pointer" onclick="showSection('list')">MASTER READER</h1>
            <button onclick="lockSystem()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded text-zinc-400">Çıkış</button>
        </nav>
        <main class="container mx-auto p-4 min-h-screen">
            <div id="manga-list-section" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-6"></div>
            <div id="manga-detail-section" class="hidden max-w-4xl mx-auto bg-zinc-900/50 p-6 rounded-xl border border-zinc-800">
                <button onclick="showSection('list')" class="bg-zinc-800 px-4 py-2 rounded text-sm mb-6">← Geri Dön</button>
                <div class="flex flex-col md:flex-row gap-6">
                    <img id="detail-cover" class="w-48 h-68 object-cover rounded-lg border border-zinc-700">
                    <div class="flex-1">
                        <h2 id="detail-title" class="text-2xl font-bold text-amber-500 mb-4"></h2>
                        <div id="detail-chapters" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
            <div id="reader-section" class="hidden max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-4 bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                    <button id="reader-back-btn" class="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded text-sm">← Geri</button>
                    <span id="reader-chapter-title" class="text-amber-500 text-sm truncate"></span>
                </div>
                <div id="chapter-images" class="flex flex-col bg-black p-1"></div>
            </div>
        </main>
    </div>

    <script>
        const TUNNEL_URL = `${window.location.origin}/api/tunnel?url=`;
        const safeEncode = (str) => btoa(encodeURIComponent(str));
        const safeDecode = (str) => decodeURIComponent(atob(str));

        function verifyAndConnect() {
            const code = document.getElementById('secret-code').value;
            if(code === "123456") {
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                showSection('list');
                loadLatest();
            }
        }

        function showSection(s) {
            document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
            if(s === 'list') document.getElementById('manga-list-section').classList.remove('hidden');
            if(s === 'detail') document.getElementById('manga-detail-section').classList.remove('hidden');
            if(s === 'reader') document.getElementById('reader-section').classList.remove('hidden');
        }

        async function loadLatest() {
            const url = document.getElementById('target-site').value;
            const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(url)}`);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const listDiv = document.getElementById('manga-list-section');
            listDiv.innerHTML = '';
            
            doc.querySelectorAll('a').forEach(a => {
                const img = a.querySelector('img');
                if(img && a.href.includes('/manga/')) {
                    listDiv.innerHTML += `
                        <div class="cursor-pointer" onclick="openMangaDetail('${safeEncode(a.href)}')">
                            <img src="${img.dataset.src || img.src}" class="w-full rounded mb-2">
                            <h3 class="text-xs truncate">${a.innerText.trim() || 'Manga'}</h3>
                        </div>`;
                }
            });
        }

        async function openChapter(mUrl, cUrl, title) {
            showSection('reader');
            const chapterImages = document.getElementById('chapter-images');
            chapterImages.innerHTML = 'Yükleniyor...';
            
            const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(safeDecode(cUrl))}`);
            const html = await res.text();
            
            // MASTER REGEX: Hem JSON dizilerini, hem img src'leri, hem de data-src'leri yakalar
            const imgRegex = /(https?:\/\/[^\s"'<>\(\)]+\.(?:jpg|jpeg|png|webp|avif))/gi;
            const matches = html.match(imgRegex);
            
            chapterImages.innerHTML = '';
            if(matches) {
                // Tekrar edenleri temizle ve filtrele
                const uniqueImages = [...new Set(matches)].filter(u => !u.includes('logo') && !u.includes('avatar') && !u.includes('favicon'));
                uniqueImages.forEach(src => {
                    chapterImages.innerHTML += `<img src="${src}" class="w-full mb-1" referrerpolicy="no-referrer">`;
                });
            } else {
                chapterImages.innerHTML = '<p class="text-red-500 p-8">Görseller şifreli veya AJAX arkasında. Lütfen F12 konsoluna bak.</p>';
                console.log(html); // Teşhis için
            }
        }
        // ... (Diğer yardımcı fonksiyonlar aynı kalacak)
    </script>
</body>
</html>
