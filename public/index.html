<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> 
    <title>Bypass Manhwa Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0c0c0e; color: #e4e4e7; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="auth-panel" class="fixed inset-0 bg-zinc-950 flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold text-amber-500 mb-4 text-center tracking-wider">UNIVERSAL BYPASS PANEL</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Giriş Kodu</label>
                    <input type="password" id="secret-code" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-center text-white focus:border-amber-500 focus:outline-none" placeholder="••••••">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Kaynak Site URL</label>
                    <input type="text" id="target-site" class="w-full bg-zinc-950 border border-zinc-700 rounded p-2.5 text-white focus:border-amber-500 focus:outline-none" value="https://manhwatop.com">
                </div>
                <button onclick="verifyAndConnect()" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold p-3 rounded transition">Sistemi Başlat</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden">Hatalı kod girdiniz!</p>
            </div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <nav class="bg-zinc-900 p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 z-40 shadow-md">
            <h1 class="text-xl font-bold text-amber-500 cursor-pointer tracking-wide" onclick="showSection('list')">TEMİZ MANHWA</h1>
            <button onclick="lockSystem()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded text-zinc-400 hover:text-white">Çıkış</button>
        </nav>

        <main class="container mx-auto p-4 min-h-screen">
            
            <div id="manga-list-section" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"></div>

            <div id="manga-detail-section" class="hidden max-w-4xl mx-auto bg-zinc-900/50 p-6 rounded-xl border border-zinc-800">
                <button onclick="showSection('list')" class="bg-zinc-800 px-4 py-2 rounded text-sm mb-6 hover:bg-zinc-700">← Geri Dön</button>
                <div class="flex flex-col md:flex-row gap-6 items-center md:items-start">
                    <img id="detail-cover" class="w-48 h-68 object-cover rounded-lg shadow-lg border border-zinc-700">
                    <div class="flex-1 w-full">
                        <h2 id="detail-title" class="text-2xl font-bold text-amber-500 mb-4 text-center md:text-left"></h2>
                        <h3 class="text-md font-semibold text-zinc-400 mb-2 border-b border-zinc-800 pb-2">Bölümler</h3>
                        <div id="detail-chapters" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>

            <div id="reader-section" class="hidden max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-4 bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                    <button id="reader-back-btn" class="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1.5 rounded text-sm">← Bölüm Listesi</button>
                    <span id="reader-chapter-title" class="font-semibold text-amber-500 text-sm truncate max-w-[200px]"></span>
                </div>
                <div id="chapter-images" class="flex flex-col bg-black p-1 rounded-lg shadow-2xl overflow-hidden"></div>
            </div>

        </main>
    </div>

    <script>
        const TUNNEL_URL = `${window.location.origin}/api/tunnel?url=`;
        let currentTargetUrl = "";

        function verifyAndConnect() {
            const code = document.getElementById('secret-code').value;
            if(code === "123456") {
                currentTargetUrl = document.getElementById('target-site').value.replace(/\/$/, "");
                document.getElementById('auth-panel').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                showSection('list');
                loadLatest();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function lockSystem() {
            document.getElementById('auth-panel').classList.remove('hidden');
            document.getElementById('app-content').classList.add('hidden');
        }

        function showSection(section) {
            document.getElementById('manga-list-section').classList.add('hidden');
            document.getElementById('manga-detail-section').classList.add('hidden');
            document.getElementById('reader-section').classList.add('hidden');

            if(section === 'list') document.getElementById('manga-list-section').classList.remove('hidden');
            if(section === 'detail') document.getElementById('manga-detail-section').classList.remove('hidden');
            if(section === 'reader') document.getElementById('reader-section').classList.remove('hidden');
        }

        // 1. ANA SAYFA LİSTESİ (Esnek Link Yakalayıcı)
        async function loadLatest() {
            const listDiv = document.getElementById('manga-list-section');
            listDiv.innerHTML = '<p class="text-center col-span-full text-zinc-400 p-12">Ana sayfa listesi yükleniyor...</p>';
            
            try {
                const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(currentTargetUrl)}`);
                const htmlText = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const manhwara = [];

                doc.querySelectorAll('a').forEach(aTag => {
                    const href = aTag.getAttribute('href');
                    if (!href) return;

                    // Link yapısı kontrolü: Dış link değilse ve boş değilse al
                    if (href.startsWith('http') && href.length > currentTargetUrl.length + 3) {
                        const cleanHref = href.replace(/\/$/, "");
                        const slug = cleanHref.substring(cleanHref.lastIndexOf('/') + 1);
                        
                        // Menü veya ana sayfa linklerini filtrele (Örn: /privacy, /genres, /bookmark gibi olmasın)
                        const blacklist = ['privacy', 'terms', 'bookmark', 'genres', 'manga-list', 'history', 'home', 'login', 'register'];
                        if(blacklist.includes(slug) || slug.includes('?')) return;

                        const title = aTag.innerText.trim();
                        const imgTag = aTag.querySelector('img') || aTag.closest('div')?.querySelector('img');
                        let img = imgTag ? (imgTag.getAttribute('data-src') || imgTag.getAttribute('src') || imgTag.getAttribute('data-lazy-src') || "") : "";

                        if (title && title.length > 2 && !manhwara.some(m => m.slug === slug)) {
                            manhwara.push({ title, img, slug });
                        }
                    }
                });

                listDiv.innerHTML = '';
                if(manhwara.length === 0) {
                    listDiv.innerHTML = '<p class="text-center col-span-full text-zinc-500 p-8">Siteden manga listesi süzülemedi. HTML yapısı çok farklı.</p>';
                    return;
                }

                manhwara.forEach(manga => {
                    listDiv.innerHTML += `
                        <div class="bg-zinc-900 rounded-lg overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition duration-300 border border-zinc-800" onclick="openMangaDetail('${manga.slug}')">
                            <img src="${manga.img}" class="w-full h-72 object-cover" onerror="this.src='https://placehold.co/300x450/18181b/71717a?text=Manga'">
                            <div class="p-3">
                                <h3 class="text-sm font-bold text-center line-clamp-2 text-zinc-200">${manga.title}</h3>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                listDiv.innerHTML = '<p class="text-center col-span-full text-red-500 p-8">Hata: Bağlantı tüneli başarısız.</p>';
            }
        }

        // 2. DETAY & BÖLÜM LİSTESİ (Yeni Esnek URL Filtresi)
        async function openMangaDetail(slug) {
            showSection('detail');
            document.getElementById('detail-title').innerText = "Bölümler taranıyor...";
            document.getElementById('detail-chapters').innerHTML = "";
            
            try {
                // Link yapısını dinamik kuruyoruz: site.com/manga-ismi
                const targetUrl = `${currentTargetUrl}/${slug}/`;
                const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(targetUrl)}`);
                const htmlText = await res.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const titleText = doc.querySelector('h1')?.innerText?.trim() || slug;
                const coverImg = doc.querySelector('.summary_image img, .manga-poster img, img')?.getAttribute('data-src') || doc.querySelector('img')?.getAttribute('src') || '';
                
                document.getElementById('detail-title').innerText = titleText;
                document.getElementById('detail-cover').src = coverImg;

                const chapters = [];
                doc.querySelectorAll('a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (!href) return;

                    const lowerHref = href.toLowerCase();
                    // Akıllı Kontrol: Linkin içinde manga adı geçiyorsa VE (chapter, bolum, oneshot, ch, blm) kelimeleri barındırıyorsa
                    const isChapterLink = lowerHref.includes('chapter') || 
                                          lowerHref.includes('bolum') || 
                                          lowerHref.includes('oneshot') || 
                                          lowerHref.includes('/ch') || 
                                          lowerHref.includes('-ch-');

                    if (lowerHref.includes(slug.toLowerCase()) && isChapterLink) {
                        const parts = href.replace(/\/$/, '').split('/');
                        const chSlug = parts[parts.length - 1]; // Örn: oneshot veya chapter-1
                        const title = a.innerText.trim() || chSlug.toUpperCase();
                        
                        if (chSlug && !chapters.some(c => c.slug === chSlug)) {
                            chapters.push({ title, slug: chSlug });
                        }
                    }
                });

                const chaptersDiv = document.getElementById('detail-chapters');
                if(chapters.length === 0) {
                    chaptersDiv.innerHTML = '<p class="text-amber-500 p-4">Bölüm linki otomatik süzülemedi. Lütfen site adresini kontrol edin.</p>';
                    return;
                }

                chapters.forEach(ch => {
                    chaptersDiv.innerHTML += `
                        <button onclick="openChapter('${slug}', '${ch.slug}')" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm p-2.5 rounded text-left transition truncate">
                            ${ch.title}
                        </button>
                    `;
                });
            } catch (e) {
                document.getElementById('detail-title').innerText = "Hata Oluştu";
            }
        }

        // 3. REKLAMSIZ OKUYUCU
        async function openChapter(mangaSlug, chapterSlug) {
            showSection('reader');
            document.getElementById('reader-chapter-title').innerText = `${chapterSlug.toUpperCase()}`;
            document.getElementById('reader-back-btn').onclick = () => openMangaDetail(mangaSlug);

            const imgContainer = document.getElementById('chapter-images');
            imgContainer.innerHTML = '<p class="text-center p-12 text-zinc-400">Sayfalar reklamlardan arındırılıyor...</p>';

            try {
                // Link yapısı dinamik birleşiyor: site.com/manga-ismi/bölüm-ismi
                const targetUrl = `${currentTargetUrl}/${mangaSlug}/${chapterSlug}/`;
                const res = await fetch(`${TUNNEL_URL}${encodeURIComponent(targetUrl)}`);
                const htmlText = await res.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const images = [];

                doc.querySelectorAll('img').forEach(img => {
                    let src = img.getAttribute('data-src') || img.getAttribute('src') || img.getAttribute('data-lazy-src') || '';
                    if (src && src.startsWith('http')) {
                        // Logo, avatar veya ikonları hariç tutan akıllı resim süzücü
                        const isGarbage = src.includes('logo') || src.includes('avatar') || src.includes('icon') || src.includes('banner');
                        if (!isGarbage && !images.includes(src)) {
                            images.push(src.trim());
                        }
                    }
                });

                imgContainer.innerHTML = '';
                if(images.length === 0) {
                    imgContainer.innerHTML = '<p class="text-center p-8 text-amber-500">Resimler bu sayfadan ayıklanamadı.</p>';
                    return;
                }
                
                images.forEach(imgUrl => {
                    imgContainer.innerHTML += `<img src="${imgUrl}" class="w-full h-auto block" loading="lazy">`;
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                imgContainer.innerHTML = '<p class="text-center text-red-500 p-4">Tünelden resimler çekilirken hata oluştu.</p>';
            }
        }
    </script>
</body>
</html>
